version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: uniot_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root123}
      MYSQL_DATABASE: ${DB_NAME:-uniot_db}
      MYSQL_USER: ${DB_USER:-uniot_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-uniot_pass}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./kebutuhan_skripsi/01_schema_mysql.sql:/docker-entrypoint-initdb.d/01_schema.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10
      interval: 10s

volumes:
  mysql_data:
    driver: local
